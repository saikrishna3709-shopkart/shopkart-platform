services:
  postgres:
    image: postgres:16-alpine
    mem_limit: 512m
    environment:
      POSTGRES_USER: shopkart
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: shopkart
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopkart -d shopkart"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  catalog-service:
    build: ./services/catalog-service
    mem_limit: 768m
    environment:
      APP_REVISION: ${APP_REVISION:-local}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shopkart
      SPRING_DATASOURCE_USERNAME: shopkart
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /readyz HTTP/1.0\r\n\r\n' >&3 && grep -q '200' <&3"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 90s

  inventory-service:
    build: ./services/inventory-service
    mem_limit: 768m
    environment:
      APP_REVISION: ${APP_REVISION:-local}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shopkart
      SPRING_DATASOURCE_USERNAME: shopkart
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /readyz HTTP/1.0\r\n\r\n' >&3 && grep -q '200' <&3"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 90s

  payment-service:
    build: ./services/payment-service
    mem_limit: 768m
    environment:
      APP_REVISION: ${APP_REVISION:-local}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shopkart
      SPRING_DATASOURCE_USERNAME: shopkart
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /readyz HTTP/1.0\r\n\r\n' >&3 && grep -q '200' <&3"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 90s

  notification-service:
    build: ./services/notification-service
    mem_limit: 768m
    environment:
      APP_REVISION: ${APP_REVISION:-local}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shopkart
      SPRING_DATASOURCE_USERNAME: shopkart
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /readyz HTTP/1.0\r\n\r\n' >&3 && grep -q '200' <&3"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 90s

  order-service:
    build: ./services/order-service
    mem_limit: 768m
    environment:
      APP_REVISION: ${APP_REVISION:-local}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shopkart
      SPRING_DATASOURCE_USERNAME: shopkart
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      CATALOG_SERVICE_URL: http://catalog-service:8000
      INVENTORY_SERVICE_URL: http://inventory-service:8000
      PAYMENT_SERVICE_URL: http://payment-service:8000
      NOTIFICATION_SERVICE_URL: http://notification-service:8000
    depends_on:
      catalog-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      # Notifications are best-effort, so this is a start-order hint only —
      # order-service stays up if notification-service is down.
      notification-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /readyz HTTP/1.0\r\n\r\n' >&3 && grep -q '200' <&3"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 90s

  storefront-service:
    build: ./services/storefront-service
    mem_limit: 512m
    environment:
      APP_REVISION: ${APP_REVISION:-local}
      CATALOG_SERVICE_URL: http://catalog-service:8000
      ORDER_SERVICE_URL: http://order-service:8000
      INVENTORY_SERVICE_URL: http://inventory-service:8000
      PAYMENT_SERVICE_URL: http://payment-service:8000
      NOTIFICATION_SERVICE_URL: http://notification-service:8000
    ports:
      - "${SHOPKART_BIND_ADDRESS:-127.0.0.1}:${SHOPKART_PORT:-8080}:8000"
    depends_on:
      catalog-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /readyz HTTP/1.0\r\n\r\n' >&3 && grep -q '200' <&3"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 90s

volumes:
  pgdata:
