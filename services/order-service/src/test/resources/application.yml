spring:
  datasource:
    url: jdbc:h2:mem:orders;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

services:
  catalog-url: http://catalog
  inventory-url: http://inventory
  payment-url: http://payment
  notification-url: http://notification
  downstream-timeout: 3s
  notification-timeout: 2s

order:
  max-items: 20